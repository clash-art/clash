  - 'apps/api-node'
  - 'apps/desktop'
  - 'apps/docs'
  - 'apps/local-api'
  - 'apps/render-server'
  - 'apps/web'
  - 'packages/remotion-*'
  - 'packages/director-*'
  - 'packages/shared-*'
  - 'packages/action-sdk'
