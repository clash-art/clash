name: Prepare pinned OpenMA common
description: >
  Check out immutable @openma/common v0.5.0 and install its dependencies.
  The committed dist is the published GitHub release tarball. This action does
  not build or test openma-common; upstream CI owns that suite.

runs:
  using: composite
  steps:
    - name: Use the pinned OpenMA common release
      shell: bash
      env:
        # v0.5.0 annotated tag peels to this commit. The release asset
        # openma-common-0.5.0.tgz is that commit's dist, packed for consumers
        # that install from Git. npm does not publish this private package.
        OPENMA_COMMON_SHA: 08ad161ac7eb8605b6d71c825b1a8fe2d461d074
        OPENMA_COMMON_TAG: v0.5.0
        OPENMA_COMMON_TARBALL_SHA256: 4f79bf81a9d73cbe15a5ed9dfdd55653c9d401e52f03077b81eaf85ed7c92dc3
        OPENMA_COMMON_TARBALL_URL: https://github.com/openma-ai/openma-common/releases/download/v0.5.0/openma-common-0.5.0.tgz
      run: |
        set -euo pipefail
        dest="../openma-common"
        rm -rf "${dest}"
        git clone --filter=blob:none --no-checkout https://github.com/openma-ai/openma-common.git "${dest}"
        git -C "${dest}" checkout --detach "${OPENMA_COMMON_SHA}"
        git -C "${dest}" fetch --depth 1 origin "refs/tags/${OPENMA_COMMON_TAG}:refs/tags/${OPENMA_COMMON_TAG}"
        node .github/scripts/verify-openma-prebuilt.ts
        pnpm --dir "${dest}" install --frozen-lockfile
