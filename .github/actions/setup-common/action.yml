name: Prepare pinned OpenMA common
description: Reproduce the shared runtime and UI used by Desktop, from the immutable v0.5.0 release.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/openma-ai/openma-common.git ../openma-common
        git -C ../openma-common checkout 08ad161ac7eb8605b6d71c825b1a8fe2d461d074
        pnpm --dir ../openma-common install --frozen-lockfile
        pnpm --dir ../openma-common verify
