name: Publish Desktop Stable

# Version-tagged stable desktop release (separate from rolling desktop-preview).
# Publication stays manual until desktop stable acceptance is enabled.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: vars.CLASH_STABLE_DESKTOP_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate stable tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vX.Y.Z, got ${tag}"
            exit 1
          fi

      - name: Download packaged macOS arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Clash-Desktop-macOS-arm64
          path: desktop-artifacts
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Prepare previous stable blockmap for differential updates
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/release
          cp -R desktop-artifacts/. apps/desktop/release/
          node apps/desktop/scripts/prepare-stable-release-assets.ts apps/desktop/release

      - name: Create or update the stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          release_root="apps/desktop/release"
          extra_assets=()
          if [ -f "${release_root}/previous-stable-blockmap.json" ]; then
            prev_path="$(jq -r '.path // empty' "${release_root}/previous-stable-blockmap.json")"
            if [ -n "${prev_path}" ] && [ -f "${prev_path}" ]; then
              extra_assets+=("${prev_path}")
            fi
          fi
          shopt -s nullglob
          assets=(
            "${release_root}"/Clash-Desktop-*-macOS-arm64.zip
            "${release_root}"/Clash-Desktop-*-macOS-arm64.dmg
            "${release_root}"/latest-mac.yml
            "${release_root}"/*.zip.blockmap
            "${release_root}"/*.dmg.blockmap
          )
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" "${assets[@]}" "${extra_assets[@]}" --generate-notes --verify-tag
          else
            gh release upload "${tag}" "${assets[@]}" "${extra_assets[@]}" --clobber
          fi
