name: Package Desktop

on:
  workflow_call:
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

jobs:
  package:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
            smoke: full
            script: pack:desktop:mac:arm64
            asset: apps/desktop/release/Clash-Desktop-macOS-arm64.dmg
          - os: macos-latest
            platform: macOS-x64
            smoke: launch
            script: pack:desktop:mac:x64
            asset: apps/desktop/release/Clash-Desktop-macOS-x64.dmg
          - os: windows-latest
            platform: Windows
            smoke: launch
            script: pack:desktop:win
            asset: apps/desktop/release/Clash-Desktop-Windows-x64.exe
          - os: ubuntu-latest
            platform: Linux
            smoke: launch
            script: pack:desktop:linux
            asset: apps/desktop/release/Clash-Desktop-Linux-x64.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          linux-apt-packages: ffmpeg libfuse2

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_KEY_PASSWORD_LEGACY: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${MAC_CSC_LINK}" ]; then
            csc_key_password="${MAC_CSC_KEY_PASSWORD:-${CSC_KEY_PASSWORD_LEGACY:-}}"
            if [ -z "${csc_key_password}" ]; then
              echo "::error::Developer ID signing requires MAC_CSC_KEY_PASSWORD (or legacy CSC_KEY_PASSWORD)." >&2
              exit 1
            fi
            echo "CLASH_DESKTOP_MAC_SIGN_MODE=developer-id" >> "$GITHUB_ENV"
            {
              echo "CSC_LINK<<EOF"
              printf '%s\n' "${MAC_CSC_LINK}"
              echo "EOF"
            } >> "$GITHUB_ENV"
            tmp_id="$(uuidgen | tr '[:upper:]' '[:lower:]')"
            cert_file="${TMPDIR:-/tmp}/clash-mac-cert-${tmp_id}.p12"
            pass_file="${TMPDIR:-/tmp}/clash-csc-pass-${tmp_id}"
            link_file="${TMPDIR:-/tmp}/clash-csc-link-${tmp_id}"
            printf '%s' "${csc_key_password}" > "${pass_file}"
            chmod 600 "${pass_file}"
            printf '%s' "${MAC_CSC_LINK}" > "${link_file}"
            chmod 600 "${link_file}"
            if base64 -D -i "${link_file}" -o "${cert_file}" 2>/dev/null \
              && chmod 600 "${cert_file}" \
              && { openssl pkcs12 -in "${cert_file}" -noout -passin "file:${pass_file}" 2>/dev/null \
                || openssl pkcs12 -in "${cert_file}" -noout -passin "file:${pass_file}" -legacy 2>/dev/null; }; then
              echo "MAC_CSC_LINK openssl preflight succeeded."
            else
              echo "::warning::MAC_CSC_LINK openssl preflight failed (non-blocking); electron-builder will import the certificate."
            fi
            rm -f "${pass_file}" "${link_file}" "${cert_file}"
            echo "APPLE_TEAM_ID=962863MJ5J" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "$GITHUB_ENV"
            if [ -z "${APPLE_API_KEY_BASE64}" ]; then
              echo "Developer ID signing requested but APPLE_API_KEY_BASE64 is missing." >&2
              exit 1
            fi
            api_key_file="${TMPDIR:-/tmp}/clash-apple-api-key-${tmp_id}.p8"
            printf '%s' "${APPLE_API_KEY_BASE64}" | base64 -D > "${api_key_file}"
            chmod 600 "${api_key_file}"
            echo "APPLE_API_KEY=${api_key_file}" >> "$GITHUB_ENV"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
            fi
          else
            echo "CLASH_DESKTOP_MAC_SIGN_MODE=ad-hoc" >> "$GITHUB_ENV"
            echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
            echo 'CLASH_ELECTRON_BUILDER_EXTRA_ARGS=--config.mac.identity=- --config.mac.notarize=false' >> "$GITHUB_ENV"
          fi

      - name: Package desktop
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: pnpm run ${{ matrix.script }}

      - name: Sanity-check the packaged binary
        env:
          CLASH_DESKTOP_PACK_PLATFORM: ${{ matrix.platform }}
          CLASH_DESKTOP_VERIFY_MAC_SEAL: ${{ runner.os == 'macOS' && '1' || '0' }}
          CLASH_DESKTOP_MAC_SIGN_MODE: ${{ env.CLASH_DESKTOP_MAC_SIGN_MODE }}
        run: node apps/desktop/scripts/packaged-binary-sanity.ts

      - name: Remove Apple notarization API key
        if: always() && runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "${APPLE_API_KEY}"
          fi

      - name: Upload desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: Clash-Desktop-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      # The agent-first local v1 gate is the desktop-first acceptance check
      # for macOS Apple Silicon. Other platforms only launch the packaged
      # binary. storage-doctor-repair-smoke.ts stays inside that gate.
      - name: Verify local integrity after packaging
        if: matrix.smoke == 'full'
        run: pnpm --dir apps/desktop test:e2e:agent-first-local-v1

      - name: Upload local integrity evidence
        if: always() && matrix.smoke == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-integrity-${{ github.sha }}
          path: |
            .tmp/agent-first-local-v1-gate/**
            .tmp/agent-first-cas/**
            .tmp/project-workspace-cli/**
            .tmp/storage-doctor-repair/**
            .tmp/short-drama-timeline/**
