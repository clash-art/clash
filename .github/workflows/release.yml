name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  desktop-checks:
    uses: ./.github/workflows/ci.yml

  package-desktop:
    needs: [desktop-checks]
    uses: ./.github/workflows/package-desktop.yml
    secrets: inherit

  publish-desktop-preview:
    name: Publish Desktop Preview
    runs-on: ubuntu-latest
    needs: [package-desktop]
    # Packaging is automatic; publication requires installed-app acceptance
    # for these exact artifacts and approval in this protected environment.
    if: github.event_name == 'workflow_dispatch' && vars.CLASH_PREVIEW_PUBLICATION_ENABLED == 'true'
    environment: desktop-preview-acceptance
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: Clash-Desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Point the rolling preview tag at this build
        run: |
          git tag --force desktop-preview "$GITHUB_SHA"
          git push origin refs/tags/desktop-preview --force

      - name: Prepare previous preview blockmap for differential updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/prepare-preview-release-assets.ts desktop-artifacts

      - name: Create or update the rolling desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view desktop-preview >/dev/null 2>&1; then
            gh release edit desktop-preview \
              --title "Clash Desktop Preview" \
              --notes "Unsigned preview installers built from ${GITHUB_SHA}. Where agents co-create, humans are welcome too." \
              --prerelease
          else
            gh release create desktop-preview \
              --title "Clash Desktop Preview" \
              --notes "Unsigned preview installers built from ${GITHUB_SHA}. Where agents co-create, humans are welcome too." \
              --prerelease
          fi
          upload=(desktop-artifacts/Clash-Desktop-*)
          if [ -f desktop-artifacts/preview-mac.yml ]; then
            upload+=(desktop-artifacts/preview-mac.yml)
          fi
          if [ -f desktop-artifacts/previous-preview-blockmap.json ]; then
            prev_path="$(jq -r '.path // empty' desktop-artifacts/previous-preview-blockmap.json)"
            if [ -n "${prev_path}" ] && [ -f "${prev_path}" ]; then
              upload+=("${prev_path}")
            fi
          fi
          gh release upload desktop-preview "${upload[@]}" --clobber
