name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-checks:
    name: Desktop Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          linux-apt-packages: ffmpeg

      - run: make lint
      - run: node --test scripts/runtime-dependency-identity.test.ts .github/scripts/verify-openma-prebuilt.test.ts scripts/deploy-config-environment.test.ts scripts/ensure-dev-vars.test.ts scripts/e2e/harness.test.ts scripts/architecture-boundaries.test.ts
      - run: pnpm --filter @clash/desktop test
      - name: Verify Web unit tests
        run: pnpm --dir apps/web exec vitest run
      - name: Verify every Project Host adapter passes the shared contract
        run: |
          pnpm --dir packages/shared-runtime exec vitest run src/cloud-project-host src/generator-contract.test.ts src/generator-validator-codegen.test.ts src/provider-credentials.test.ts
          # asset-sdk tests resolve workspace deps through their built entries.
          pnpm exec turbo run build --filter='@clash/asset-sdk^...'
          pnpm --dir packages/asset-sdk exec vitest run src/asset-import-request.test.ts src/project-asset-http-client.test.ts
          pnpm --dir apps/local-api exec vitest run src/project-host.contract.test.ts
          # api-node's render worker imports shared-runtime modules that resolve @clash/action-sdk through its built entries.
          pnpm exec turbo run build --filter='@clash/api-node^...'
          pnpm --dir apps/api-node exec vitest run src/project-host.contract.test.ts src/timeline-host.test.ts src/timeline-definition.test.ts src/personal-assets.test.ts src/timeline-render.test.ts src/app.test.ts src/relay-http.test.ts
          pnpm --dir apps/api-cf exec vitest run src/startup-imports.test.ts src/generated/cloud-plugin-validators.test.ts src/routes/v1/project-assets.test.ts src/routes/v1/voice-input.test.ts src/agents/project-room-loro-remote.test.ts
          pnpm --dir apps/api-cf exec vitest run --config vitest.integration.config.mts src/integration/project-host.contract.integration.test.ts src/integration/project-room-host-command.integration.test.ts src/integration/project-assets.integration.test.ts src/integration/project-websocket-auth.integration.test.ts
      - name: Verify Storyboard references and chat drafts
        run: pnpm --dir packages/web-ui exec vitest run src/components/PluginStoryboardSurface.test.tsx src/components/copilot/useCopilotComposerDraft.test.tsx src/components/copilot/projectAssetReferences.test.ts src/components/copilot/ChatInput.test.tsx
      - name: Verify UI reads Project Host capabilities, not backend mode
        run: pnpm --dir packages/web-ui exec vitest run src/hooks/projectHostReads.runtimeAgnostic.test.tsx src/hooks/useRevisionHistory.test.ts src/lib/runtimeConfig.test.ts src/lib/assetUploadLabel.test.ts src/hooks/useLoroSync.closeReason.test.ts src/components/ProjectWorkspaceNavigator.test.tsx src/components/ScopedAssetPicker.test.tsx
      - name: Verify workspace controls and native Asset provenance
        run: pnpm --dir packages/web-ui exec vitest run src/components/CloudConnection.test.tsx src/components/ChatbotCopilot.desktop.test.tsx src/components/visualLanguage.test.tsx src/features/assets/AssetWorkspace.test.tsx src/features/assets/relations.test.ts
      - name: Verify current Timeline render and cloud admission contracts
        run: pnpm --dir apps/local-api exec vitest run src/local-timeline-references.test.ts src/timeline-durable-workflow.test.ts src/local-timeline-generator-product.test.ts src/project-cloud-admission-route.test.ts
      - name: Verify Project Loro sync, canvas layout admission, and cloud replication
        run: pnpm --dir apps/local-api exec vitest run src/sync.test.ts src/canvas-layout.test.ts src/project-cloud-sync.test.ts src/project-cloud-admission.test.ts src/project-metadata-replication.test.ts src/sync-config.test.ts src/cloud-accounts.test.ts src/loro
      - name: Build benchmark host runtime
        run: pnpm build:package clash
      - name: Verify bundled plugin payloads are declared build dependencies
        run: pnpm --dir apps/local-api exec vitest run src/bundled-plugins-set.test.ts
      # After the host runtime build: the full suite spawns the built plugin
      # payloads (provider replays, asset-edit) and resolves the built
      # plugins/clash runtime, and Turbo builds every workspace package those
      # depend on (@clash/shared-types, @clash/shared-layout, ...) first.
      - name: Run the full local-api suite
        run: pnpm --filter @clash/local-api test
      - name: Verify api-cf identity and D1 query budgets
        run: pnpm --dir apps/api-cf exec vitest run src/app.d1-query-count.test.ts src/services/session-fast.contract.test.ts src/app.auth.test.ts src/app.project-transport-auth.test.ts src/startup-imports.test.ts
      - name: Verify metadata-service ports, Worker parity and read replicas, and Node mono/micro smoke
        run: |
          pnpm --dir packages/metadata-service exec vitest run
          pnpm --dir apps/api-cf exec vitest run src/metadata-worker.parity.test.ts src/metadata-worker.replica.test.ts
          pnpm --dir apps/api-node exec vitest run src/metadata-service.test.ts
          pnpm --dir packages/shared-runtime exec vitest run src/project-authorization-postgres.test.ts
      - name: Verify benchmark catalog, runner, and evaluator contracts
        run: pnpm --dir packages/shared-artifact-evals exec vitest run

  remotion-parity:
    name: Remotion server/browser parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          linux-apt-packages: ffmpeg

      # The parity script calls @remotion/renderer's ensureBrowser(), which
      # downloads the Chromium 157.0.8080.0 build pinned by Remotion 4.0.536.
      # The render-server image installs distro chromium instead; keeping this
      # on Remotion's pinned build makes browser and server renders comparable.
      - name: Cache Remotion browser
        uses: actions/cache@v6
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      # The browser bundle resolves workspace packages through their built
      # entries (e.g. @clash/shared-types dist), so build remotion-ui's deps.
      - name: Build workspace packages the fixture imports
        run: pnpm exec turbo run build --filter=@clash/remotion-ui^...

      - name: Render fixture frames through both renderers and compare SSIM
        run: pnpm test:remotion-parity
