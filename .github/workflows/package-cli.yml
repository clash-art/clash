name: Package CLI

# Self-contained CLI/daemon archives (bundled Node, native dependencies, ffmpeg
# and ffprobe). Packaging without publication: archives are workflow artifacts.
# A pull request always builds linux-x64; the full matrix runs for
# workflow_dispatch, callers (Release), the ci:package label, or a pull request
# that changes the packaging itself.
on:
  workflow_dispatch:
  workflow_call:
    # The Desktop app's Developer ID and notarization key; darwin archives are
    # left unsigned when they are absent.
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: package-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select targets
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:package') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          packaging='^(plugins/clash/(scripts/|package\.json$|node-runtime\.lock\.json$|install\.)|scripts/(packaged-runtime-binaries|runtime-dependency-identity)\.ts$|\.github/workflows/package-cli\.yml$)'
          full=true
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${LABELLED}" != "true" ]; then
            if ! gh pr diff "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --name-only | grep -Eq "${packaging}"; then
              full=false
            fi
          fi
          # Every target builds natively: npm installs the host's native optional dependencies.
          linux_x64='{"target":"linux-x64","os":"ubuntu-24.04","experimental":false}'
          rest='{"target":"linux-arm64","os":"ubuntu-24.04-arm","experimental":false},
                {"target":"darwin-arm64","os":"macos-14","experimental":false},
                {"target":"darwin-x64","os":"macos-15-intel","experimental":false},
                {"target":"win32-x64","os":"windows-latest","experimental":true}'
          if [ "${full}" = "true" ]; then include="${linux_x64},${rest}"; else include="${linux_x64}"; fi
          echo "matrix={\"include\":[$(echo "${include}" | tr -d '\n ')]}" >> "${GITHUB_OUTPUT}"

  package:
    name: Package CLI (${{ matrix.target }})
    needs: [plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # win32-x64 has never been exercised outside CI; it reports without gating
    # until its first green run (see apps/docs/guide/release-pipeline.md).
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - run: pnpm build:package clash

      # Same identity, team and gate as package-desktop.yml: Developer ID when
      # MAC_CSC_LINK is present, otherwise the binaries ship as published.
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          # Like Desktop, which only packages from Release: pull requests stay unsigned.
          MAC_CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_KEY_PASSWORD_LEGACY: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CSC_LINK}" ]; then
            echo "::notice::No signing secrets for this ${GITHUB_EVENT_NAME} run; the ${{ matrix.target }} archive is not signed or notarized."
            exit 0
          fi
          csc_key_password="${MAC_CSC_KEY_PASSWORD:-${CSC_KEY_PASSWORD_LEGACY:-}}"
          if [ -z "${csc_key_password}" ]; then
            echo "::error::Developer ID signing requires MAC_CSC_KEY_PASSWORD (or legacy CSC_KEY_PASSWORD)." >&2
            exit 1
          fi
          if [ -z "${APPLE_API_KEY_BASE64}" ] || [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER}" ]; then
            echo "::error::Developer ID signing requires APPLE_API_KEY_BASE64, APPLE_API_KEY_ID and APPLE_API_ISSUER." >&2
            exit 1
          fi
          tmp_id="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          keychain="${RUNNER_TEMP}/clash-cli-${tmp_id}.keychain-db"
          api_key_file="${RUNNER_TEMP}/clash-apple-api-key-${tmp_id}.p8"
          cert_file="${RUNNER_TEMP}/clash-mac-cert-${tmp_id}.p12"
          # Recorded first so the cleanup step removes them even if this step fails.
          echo "CLASH_CLI_MAC_SIGN_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${api_key_file}" >> "$GITHUB_ENV"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 -D > "${api_key_file}"
          chmod 600 "${api_key_file}"
          printf '%s' "${MAC_CSC_LINK}" | base64 -D > "${cert_file}"
          chmod 600 "${cert_file}"
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert_file}" -f pkcs12 -P "${csc_key_password}" -k "${keychain}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${cert_file}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" >/dev/null
          # codesign resolves the certificate chain through the user search list.
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | awk '/Developer ID Application/ && /962863MJ5J/ { print $2; exit }')"
          if [ -z "${identity}" ]; then
            echo "::error::MAC_CSC_LINK holds no Developer ID Application identity for team 962863MJ5J." >&2
            exit 1
          fi
          echo "CLASH_CLI_MAC_SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"

      # On macOS with CLASH_CLI_MAC_SIGN_IDENTITY set, every Mach-O is signed
      # before the manifest digests, archive and SHA256SUMS are written.
      - name: Pack the self-contained distribution
        shell: bash
        run: pnpm --dir plugins/clash pack:distribution --self-contained "${GITHUB_WORKSPACE}/cli-artifacts"

      - name: Check the archive targets this runner
        shell: bash
        run: ls -l cli-artifacts && test -f cli-artifacts/clash-*-${{ matrix.target }}.SHA256SUMS

      # Notarization registers the signed code with Apple and leaves the archive
      # bytes alone, so its checksums stay valid. A .tgz cannot carry a stapled
      # ticket; Gatekeeper looks the ticket up online.
      - name: Notarize the signed binaries
        if: runner.os == 'macOS' && env.CLASH_CLI_MAC_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/clash-notarize.XXXXXX")"
          tar -xzf cli-artifacts/clash-*-${{ matrix.target }}.tgz -C "${work}"
          codesign --verify --strict --verbose=2 "${work}/package/node/bin/node"
          codesign -dvv "${work}/package/node/bin/node" 2>&1 | grep -q 'TeamIdentifier=962863MJ5J'
          ditto -c -k --keepParent "${work}/package" "${work}/notarize.zip"
          xcrun notarytool submit "${work}/notarize.zip" --wait --output-format json \
            --key "${APPLE_API_KEY}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}" \
            | tee "${work}/notarization.json"
          if ! grep -Eq '"status" *: *"Accepted"' "${work}/notarization.json"; then
            submission="$(sed -En 's/.*"id" *: *"([^"]+)".*/\1/p' "${work}/notarization.json" | head -n 1)"
            if [ -n "${submission}" ]; then
              xcrun notarytool log "${submission}" \
                --key "${APPLE_API_KEY}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}" || true
            fi
            echo "::error::Apple did not accept the ${{ matrix.target }} archive for notarization." >&2
            exit 1
          fi
          rm -rf "${work}"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Remove the signing keychain and notarization API key
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${CLASH_CLI_MAC_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "${CLASH_CLI_MAC_SIGN_KEYCHAIN}" || true
          fi
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "${APPLE_API_KEY}"
          fi
          rm -f "${RUNNER_TEMP}"/clash-mac-cert-*.p12

      # Each smoke runs the archive's own Node and fails if `node` resolves on PATH.
      - name: Smoke in a bare container without Node
        if: runner.os == 'Linux'
        run: node plugins/clash/scripts/smoke-self-contained.ts --container debian:bookworm-slim --archive cli-artifacts/clash-*-${{ matrix.target }}.tgz

      - name: Smoke with only the bundled Node reachable
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          work="$(mktemp -d /tmp/clash-cli.XXXXXX)"
          tar -xzf cli-artifacts/clash-*-${{ matrix.target }}.tgz -C "${work}"
          cp plugins/clash/scripts/smoke-self-contained.ts "${work}/"
          cd "${work}"
          env -i HOME="${HOME}" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "${work}/package/node/bin/node" "${work}/smoke-self-contained.ts" \
            --root "${work}/package" --require-no-system-node

      - name: Smoke with only the bundled Node reachable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'clash-cli'
          New-Item -ItemType Directory -Force $work | Out-Null
          $archive = (Get-ChildItem cli-artifacts -Filter 'clash-*-${{ matrix.target }}.zip').FullName
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $work
          if ($LASTEXITCODE -ne 0) { throw 'unpacking the archive failed' }
          Copy-Item plugins/clash/scripts/smoke-self-contained.ts $work
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Set-Location $work
          & "$work\package\node\node.exe" "$work\smoke-self-contained.ts" --root "$work\package" --require-no-system-node
          if ($LASTEXITCODE -ne 0) { throw 'self-contained smoke failed' }

      - name: Retain the exact tested archive
        uses: actions/upload-artifact@v7
        with:
          name: clash-cli-${{ matrix.target }}
          path: cli-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  checksums:
    name: Checksums and provenance
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: plugins/clash

      - uses: actions/download-artifact@v8
        with:
          pattern: clash-cli-*
          path: cli-artifacts
          merge-multiple: true

      - name: Verify every archive and write SHA256SUMS
        working-directory: cli-artifacts
        run: |
          set -euo pipefail
          cp ../plugins/clash/install.sh ../plugins/clash/install.ps1 .
          for part in *.SHA256SUMS; do sha256sum --check --strict "${part}"; done
          shopt -s nullglob
          archives=(clash-*.tgz clash-*.zip)
          test "${#archives[@]}" -gt 0
          sha256sum "${archives[@]}" install.sh install.ps1 | sort -k 2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      # Signed build provenance needs the OIDC token, which fork pull requests never get.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-checksums: cli-artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: clash-cli-release
          path: |
            cli-artifacts/SHA256SUMS
            cli-artifacts/install.sh
            cli-artifacts/install.ps1
          if-no-files-found: error
          retention-days: 14
