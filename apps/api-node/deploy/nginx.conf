# Clash gateway-node public data-plane LB (SSE-friendly).
# Mounted by compose as ./deploy/nginx.conf (see Epic B #374).
# Admin listens on a separate upstream and must NOT be published here.
# Staging / self-host only — never point this at production Cloudflare.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  # Long-lived LLM streams: least_conn, not round-robin.
  upstream gateway_api {
    least_conn;
    server gateway-1:8080 max_fails=3 fail_timeout=10s;
    server gateway-2:8080 max_fails=3 fail_timeout=10s;
    server gateway-3:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Admin is a different threat model. Keep it off the public server block.
  # Operators reach it via VPN / SSH tunnel / private network only.
  # upstream gateway_admin {
  #   server admin:8081;
  # }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # GATEWAY_MAX_STREAM_MS default upper bound + drain grace (NODES §3.7).
  # Keep proxy_*_timeout >= max stream; idle timeout must exceed SSE : ping.
  log_format gateway '$remote_addr - $request_id $status '
                     '$upstream_addr $request_time $upstream_response_time';

  server {
    listen 80;
    server_name _;

    # Reject accidentally exposed admin paths on the public listener.
    location ^~ /admin {
      return 404;
    }
    location ^~ /api/v1/admin {
      return 404;
    }

    location /healthz {
      proxy_pass http://gateway_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 5s;
    }

    location /readyz {
      proxy_pass http://gateway_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 5s;
      # LB active health checks should hit /readyz so draining nodes eject.
    }

    # Data plane: OpenAI-shaped + Anthropic-shaped streaming.
    # Do NOT retry POSTs after the body was sent (double-bill / duplicate tools).
    location /v1/ {
      proxy_pass http://gateway_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;

      proxy_buffering off;
      proxy_cache off;
      gzip off;
      chunked_transfer_encoding on;
      proxy_request_buffering off;

      # No non-idempotent retry. Only connect errors before any upstream
      # response could be considered; default is off for /v1/*.
      proxy_next_upstream off;

      # ≥ GATEWAY_MAX_STREAM_MS + grace (900s). Tune with the gateway env.
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_connect_timeout 10s;
    }

    # Optional gateway control paths on the same public origin (tokens, me).
    location /api/v1/gateway/ {
      proxy_pass http://gateway_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_buffering off;
      proxy_next_upstream off;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location / {
      return 404;
    }
  }
}
