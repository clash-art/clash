# gateway-node distributed topology (#374 + role matrix #373). Self-host =
# Postgres multi-node: N× `api`, one `admin`, one-shot `migrate`, optional
# outbox process (not a GATEWAY_ROLE), one PostgreSQL. There is no
# SQLite/filesystem single-node topology (decision 12). GATEWAY_ROLE is only
# api | admin | all | migrate — no gateway `worker` role and no Redis/BullMQ
# sidecar for gateway metering.
#
#   docker compose -f apps/api-node/deploy/compose.yaml up -d --build
#   docker compose -f apps/api-node/deploy/compose.yaml --profile test up -d --build
#   docker compose -f apps/api-node/deploy/compose.yaml --profile demo up -d --build
#
# Required environment (compose refuses to start without it):
#   POSTGRES_PASSWORD, CLOUD_PUBLIC_URL, GATEWAY_ENCRYPTION_KEYS,
#   GATEWAY_ENCRYPTION_CURRENT. See apps/api-node/README.md "Self-host topology".
# Admin / all roles also need ADMIN_AUTH_SECRET (or BETTER_AUTH_SECRET) and a
# built apps/web client at GATEWAY_ADMIN_WEB_DIR (#371/#372).
#
# Not shipped here, on purpose:
#   - a load balancer (CONTRIBUTING anti-pattern 4): point yours at the api
#     nodes' published ports, health-check GET /readyz, no sticky sessions;
#   - Redis: nothing in gateway-node reads it (BullMQ outbox runs on PostgreSQL);
#   - MinIO/S3: the Node blob store is the shared `blobs` volume below until a
#     Node S3 blob port exists;
#   - service mesh.

name: clash-gateway

x-build: &build
  context: ../../..
  dockerfile: apps/api-node/deploy/Dockerfile

x-gateway-env: &gateway-env
  DATABASE_URL: postgresql://clash:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/clash
  CLOUD_PUBLIC_URL: ${CLOUD_PUBLIC_URL:?set CLOUD_PUBLIC_URL to the load balancer origin}
  CLOUD_ASSET_DIR: /data/assets
  CLOUD_CONTENT_DIR: /data/content
  HOST: 0.0.0.0
  PORT: "8080"
  TMPDIR: /tmp

x-gateway-keys: &gateway-keys
  GATEWAY_ENCRYPTION_KEYS: ${GATEWAY_ENCRYPTION_KEYS:?set GATEWAY_ENCRYPTION_KEYS}
  GATEWAY_ENCRYPTION_CURRENT: ${GATEWAY_ENCRYPTION_CURRENT:?set GATEWAY_ENCRYPTION_CURRENT}

# Every application process waits for the one-shot migrate job; startup never migrates.
x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully

x-readyz: &readyz
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 20s

# Hardening shared by long-running gateway processes (#373).
x-harden: &harden
  # Image ENTRYPOINT is already tini; compose init is a second safety net.
  init: true
  read_only: true
  tmpfs:
    - /tmp
  # Longer than the SIGTERM drain (GATEWAY_DRAIN_DELAY_MS + GRACE + SETTLE).
  stop_grace_period: 60s
  restart: unless-stopped

x-api: &api
  build: *build
  image: clash-api-node:local
  # Empty command → image entrypoint selects GATEWAY_ROLE (default api).
  environment:
    <<: [*gateway-env, *gateway-keys]
    GATEWAY_ROLE: api
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  volumes:
    - blobs:/data
  depends_on: *after-migrate
  healthcheck: *readyz
  <<: *harden

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clash
      POSTGRES_DB: clash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: [postgres, -c, max_connections=300]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, clash, -d, clash]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot gate (#373 migrate role): GATEWAY_ROLE=migrate → gateway-cli migrate.
  migrate:
    build: *build
    image: clash-api-node:local
    environment:
      DATABASE_URL: postgresql://clash:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/clash
      GATEWAY_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"

  api-1:
    <<: *api
    ports:
      - ${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_API_1_PORT:-8081}:8080

  api-2:
    <<: *api
    ports:
      - ${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_API_2_PORT:-8082}:8080

  api-3:
    <<: *api
    ports:
      - ${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_API_3_PORT:-8083}:8080

  # Product outbox / checkpoint / settle runner — NOT a GATEWAY_ROLE (#373).
  # Separate process on the same image; BullMQ uses Postgres (no Redis sidecar).
  worker:
    build: *build
    image: clash-api-node:local
    command:
      [
        node_modules/.bin/tsx,
        --tsconfig,
        tsconfig.json,
        --import,
        ./src/telemetry-outbox.ts,
        src/outbox-worker.ts,
      ]
    environment:
      <<: *gateway-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    volumes:
      - blobs:/data
    depends_on: *after-migrate
    <<: *harden

  # Admin API + shared /admin console on GATEWAY_ADMIN_PORT (#371/#372).
  # Public PORT still serves /healthz+/readyz (no data plane on admin role).
  admin:
    build: *build
    image: clash-api-node:local
    environment:
      <<: [*gateway-env, *gateway-keys]
      GATEWAY_ROLE: admin
      GATEWAY_ADMIN_PORT: "8090"
      GATEWAY_ADMIN_HOST: 0.0.0.0
      GATEWAY_ADMIN_WEB_DIR: ${GATEWAY_ADMIN_WEB_DIR:-/srv/apps/web/dist/client}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    volumes:
      - blobs:/data
    ports:
      - ${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_ADMIN_PUBLISH_PORT:-8090}:8090
    depends_on: *after-migrate
    healthcheck: *readyz
    <<: *harden

  # Demo colocation (#373 `all`): one process, api + admin, still Postgres.
  all:
    profiles: [demo]
    build: *build
    image: clash-api-node:local
    environment:
      <<: [*gateway-env, *gateway-keys]
      GATEWAY_ROLE: all
      GATEWAY_ADMIN_PORT: "8090"
      GATEWAY_ADMIN_HOST: 0.0.0.0
      GATEWAY_ADMIN_WEB_DIR: ${GATEWAY_ADMIN_WEB_DIR:-/srv/apps/web/dist/client}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    volumes:
      - blobs:/data
    ports:
      - ${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_ALL_API_PORT:-8080}:8080
      - ${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_ALL_ADMIN_PORT:-8090}:8090
    depends_on: *after-migrate
    healthcheck: *readyz
    <<: *harden

  # Test only (#378): deterministic OpenAI/Anthropic mock with fake sk_test_* keys.
  # Isolated compose network, so the non-loopback bind is allowed here alone.
  mock-upstream:
    profiles: [test]
    build: *build
    image: clash-api-node:local
    command:
      [node_modules/.bin/tsx, --tsconfig, tsconfig.json, src/mock-upstream/cli.ts]
    environment:
      MOCK_UPSTREAM_HOST: 0.0.0.0
      MOCK_UPSTREAM_PORT: "9090"
      MOCK_UPSTREAM_ALLOW_NON_LOOPBACK: "1"
    ports:
      - 127.0.0.1:${GATEWAY_MOCK_UPSTREAM_PORT:-9090}:9090
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9090/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  # Shared by every node: CLOUD_ASSET_DIR and CLOUD_CONTENT_DIR must be one
  # store across instances (README "Personal asset library").
  blobs:
