appId: app.clash.video
productName: Clash
asar: true
npmRebuild: false
publish: null
afterPack: scripts/prune-packaged-architectures.ts

directories:
  output: release

files:
  - dist/**/*
  - package.json
  - "!src/**/*"
  - "!e2e/**/*"
  - "!*.test.*"

extraResources:
  - from: .vite/renderer/main_window
    to: web-dist
  - from: ../render-server/.remotion-bundle
    to: remotion-bundle
  - from: ../../packages/clash-sdk/python
    to: clash-sdk/python
    filter:
      - "clash_sdk/**/*"
      - "!**/__pycache__/**"
      - "!**/*.py[cod]"
  - from: build/clash-runtime
    to: clash-runtime
    filter:
      - "**/*"
  # electron-builder excludes nested node_modules from a broad extraResources
  # copy. Stage the Host runtime dependencies explicitly so native optional
  # packages (for example sharp/@img) survive into the installed app.
  - from: build/clash-runtime/node_modules
    to: clash-runtime/node_modules
    filter:
      - "**/*"

mac:
  category: public.app-category.video
  icon: build/icon.icns
  identity: null
  artifactName: Clash-Desktop-macOS-${arch}.${ext}
  x64ArchFiles: "**/node_modules/{@anthropic-ai/claude-agent-sdk-*,@esbuild/*,@remotion/compositor-*}/**"
  files:
    - "!node_modules/@anthropic-ai/claude-agent-sdk-{linux,win32}-*/**"
    - "!node_modules/@esbuild/{aix-*,android-*,freebsd-*,linux-*,netbsd-*,openbsd-*,sunos-*,win32-*}/**"
    - "!node_modules/@remotion/compositor-{linux,win32}-*/**"
  target:
    - dir
    - dmg

win:
  icon: build/icon-1024.png
  executableName: clash
  artifactName: Clash-Desktop-Windows-${arch}.${ext}
  files:
    - "!node_modules/@anthropic-ai/claude-agent-sdk-{darwin,linux}-*/**"
    - "!node_modules/@esbuild/{aix-*,android-*,darwin-*,freebsd-*,linux-*,netbsd-*,openbsd-*,sunos-*}/**"
    - "!node_modules/@remotion/compositor-{darwin,linux}-*/**"
  target:
    - nsis

linux:
  category: AudioVideo
  icon: build/icon-1024.png
  executableName: clash
  artifactName: Clash-Desktop-Linux-x64.${ext}
  files:
    - "!node_modules/@anthropic-ai/claude-agent-sdk-{darwin-*,win32-*,linux-arm64,linux-arm64-musl}/**"
    - "!node_modules/@esbuild/{aix-*,android-*,darwin-*,freebsd-*,linux-arm*,linux-ia32,linux-loong64,linux-mips64el,linux-ppc64,linux-riscv64,linux-s390x,netbsd-*,openbsd-*,sunos-*,win32-*}/**"
    - "!node_modules/@remotion/compositor-{darwin-*,win32-*,linux-arm64-*}/**"
  target:
    - AppImage
