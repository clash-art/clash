#:schema node_modules/wrangler/config-schema.json
name = "clash-api"
main = "src/index.ts"
compatibility_date = "2025-03-14"
compatibility_flags = ["nodejs_compat"]

# loro-crdt's default export condition is the wasm-URL build
# (`new URL("./loro_wasm_bg.wasm", import.meta.url)`), which Wrangler's plain
# esbuild bundle can't resolve — the Worker crashes on startup. The `base64`
# entry fails differently: it compiles wasm at runtime, which workerd forbids
# ("Wasm code generation disallowed by embedder"). The `bundler` entry
# statically imports its .wasm, which workerd accepts as a precompiled module,
# but instantiates it with a top-level `await`: inside a lazily imported module
# graph (#161) that makes esbuild's module inits async, and an import cycle
# between async inits hangs the request. src/loro/loro-crdt-workerd.ts uses the
# `web` entry instead and instantiates the precompiled .wasm synchronously.
# Alias the bare specifier centrally instead of rewriting every source import.
[alias]
"loro-crdt" = "./src/loro/loro-crdt-workerd.ts"
# Bundle ONE copy of @clash/shared-types. api-cf imports it from source via
# tsconfig paths, but other workspace packages resolve its package exports to
# dist/, so without this the bundle carried two copies and ran its top-level
# init (zod schemas, JSON-schema catalog, DSL fingerprint) twice at startup.
"@clash/shared-types" = "../../packages/shared-types/src/index.ts"
"@clash/shared-types/assets" = "../../packages/shared-types/src/assets.ts"
"@clash/shared-types/executable-plugin" = "../../packages/shared-types/src/executable-plugin.ts"
"@clash/shared-types/actions/asset-edit" = "../../packages/shared-types/src/actions/asset-edit.ts"
"@clash/shared-types/project-sync-content" = "../../packages/shared-types/src/project-sync-content.ts"
"@clash/shared-types/marketplace-installation" = "../../packages/shared-types/src/marketplace-installation.ts"
"@clash/shared-types/sync-error-severity" = "../../packages/shared-types/src/sync-error-severity.ts"
"@clash/shared-types/project-metadata" = "../../packages/shared-types/src/project-metadata.ts"
# @clash/gateway-core imports the shared resolver through this subpath.
"@clash/shared-types/model-routing" = "../../packages/shared-types/src/model-routing.ts"

# Static `.wasm` imports (loro-crdt/bundler) must be bundled as precompiled
# WebAssembly modules rather than fetched or eval'd at runtime.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Workers Logs + Traces. Logs keep head_sampling_rate = 1 everywhere:
# head sampling is decided before the request runs, so a lower rate would
# drop the same share of error-request logs. Traces are sampled at 0.1 in
# production only (cost/volume); staging keeps traces at 1. Tradeoff: ~90%
# of production requests have no trace, but every request still has logs.
# Override by editing head_sampling_rate (0..1) per env/signal below and
# redeploying with wrangler. OTLP export targets are dashboard-managed
# destinations (Workers & Pages → Observability → Destinations); list
# their names under `destinations = [...]` once created. Workers metrics
# are not exportable over OTLP. See apps/docs/guide/observability.md.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Durable Objects
[[durable_objects.bindings]]
name = "ROOM"
class_name = "ProjectRoom"

[[durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "SupervisorAgent"

# Workflow
[[workflows]]
name = "generation-workflow"
binding = "GENERATION_WORKFLOW"
class_name = "GenerationWorkflow"

# Container (Remotion render server)
# Uses Dockerfile.cf which `FROM ghcr.io/clash-art/render-server:latest` —
# the heavy multi-stage build pushed to GHCR. Local `wrangler deploy` just
# pulls the prebuilt layer instead of churning through node-prod-deps +
# chromium + ffmpeg locally. CI publishes it from master
# (.github/workflows/render-image.yml); deploying picks up the new :latest.
[[containers]]
class_name = "RenderContainer"
image = "../render-server/Dockerfile.cf"
image_build_context = "../.."
max_instances = 3

[[durable_objects.bindings]]
name = "RENDER_CONTAINER"
class_name = "RenderContainer"

[[durable_objects.bindings]]
name = "RUNTIME_ROOM"
class_name = "RuntimeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupervisorAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GenerationAgent"]

[[migrations]]
tag = "v3"
renamed_classes = [{from = "SupervisorAgent", to = "ProjectRoom"}]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SupervisorAgent"]

[[migrations]]
tag = "v5"
deleted_classes = ["GenerationAgent"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["RenderContainer"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["RuntimeRoom"]

# Workers AI
[ai]
binding = "AI"

# D1 Database (shared with frontend)
[[d1_databases]]
binding = "DB"
database_name = "clash-d1"
database_id = "00000000-0000-0000-0000-000000000000"  # Replace with your D1 id (`wrangler d1 create clash-d1` prints it)

# R2 Bucket
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "clash-r2"

# Environment variables (set via `wrangler secret put`)
# GOOGLE_API_KEY
# GOOGLE_AI_STUDIO_BASE_URL
# CF_AIG_TOKEN
# CF_AIG_OPENAI_URL
# KLING_ACCESS_KEY
# KLING_SECRET_KEY
# KLING_API_URL (optional, defaults to Beijing endpoint)
# R2_PUBLIC_URL
# JWT_SECRET
# BETTER_AUTH_SECRET (same value as the Web Worker; /api and /sync both
#   validate the browser session cookie in-process with it)
# BETTER_AUTH_ORIGIN (optional; leave unset. Only for a deployment whose
#   Better Auth handler lives outside this Worker. It must not name another
#   Worker of the same account: that fetch is refused and /sync returns 401.)
# WORKER_PUBLIC_URL

# Watch only authored source trees. Workspace dependencies resolve to source
# through tsconfig paths, so changing a shared package restarts the worker
# without first producing dist output. Keeping the list explicit still avoids
# .wrangler/state sqlite reload loops.
[build]
watch_dir = [
  "src",
  "../../packages/shared-layout/src",
  "../../packages/shared-types/src",
  "../../packages/shared-runtime/src",
  "../../packages/remotion-core/src",
]

[dev]
# Containers off for local dev — thumbnail/render dispatch goes via
# RENDER_SERVER_URL to a standalone tsx process on :8080 (see Makefile
# dev-render target). Prod deploys without RENDER_SERVER_URL so the Worker
# falls through to the RENDER_CONTAINER binding.
enable_containers = false

[vars]
# This file is what `wrangler deploy` ships, so it must never say
# "development": that value enables fallback secrets, dev trusted origins and
# the dev identity fallback. Local dev overrides it from the git-ignored
# `.dev.vars`, created on first run by scripts/ensure-dev-vars.ts.
ENVIRONMENT = "production"
BETTER_AUTH_BASE_PATH = "/api/better-auth"
RENDER_SERVER_URL = "http://localhost:8080"
# Base origin for signed asset URLs handed to render-server so its ffmpeg
# can fetch source videos over HTTP.
#   Dev:  gateway worker on :3000 (same host as the tsx render-server).
#   Prod: override with the public zone URL so the Container (running in
#         Cloudflare infra) can reach the zone over the internet.
MEDIA_GATEWAY_URL = "http://localhost:3000"
# GATEWAY_STAFF_PROMPT_ACCESS stays unset here (self-host default: no gateway
# body retention, no staff prompt view). Hosted configs set it to "enabled".

# ╔══════════════════════════════════════════════════════════════════╗
# ║  [env.staging] — isolated staging.                               ║
# ║  Staging owns ALL of its state: the `clash-staging` D1, the      ║
# ║  `clash-staging-assets` R2 bucket, and its own Durable Object    ║
# ║  namespaces, render Container and Workflow, all hosted by        ║
# ║  `clash-api-staging` itself.                                     ║
# ║                                                                  ║
# ║  It must NEVER bind `master-clash-api-hosted` (no `script_name`) ║
# ║  or the production D1 / R2. ProjectRoom re-checks ownership and  ║
# ║  credentials against the database of the Worker hosting it, so   ║
# ║  rooms and the database have to live on the same side.           ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Deploy with:  wrangler deploy --env staging   (or `make deploy-api-staging`)
[env.staging]
name = "clash-api-staging"

# Sampling override: see the top-level [observability] comment.
[env.staging.observability]
enabled = true

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 1

# Staging owns its own Durable Object namespaces, so its migration history
# is its own and must match what is already applied to `clash-api-staging`
# (append-only; see https://developers.cloudflare.com/durable-objects/reference/durable-objects-migrations/).
# The live script is at v8 from the April deploy, where v7 created
# ByoBridgeRoom and v8 created RuntimeRoom. The top-level list was later
# renumbered (v7 = RuntimeRoom) when ByoBridgeRoom was removed, so staging
# keeps its real history here and v9 deletes the class the code no longer
# exports. Append new staging migrations after v9.
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["SupervisorAgent"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["GenerationAgent"]

[[env.staging.migrations]]
tag = "v3"
renamed_classes = [{from = "SupervisorAgent", to = "ProjectRoom"}]

[[env.staging.migrations]]
tag = "v4"
new_sqlite_classes = ["SupervisorAgent"]

[[env.staging.migrations]]
tag = "v5"
deleted_classes = ["GenerationAgent"]

[[env.staging.migrations]]
tag = "v6"
new_sqlite_classes = ["RenderContainer"]

[[env.staging.migrations]]
tag = "v7"
new_sqlite_classes = ["ByoBridgeRoom"]

[[env.staging.migrations]]
tag = "v8"
new_sqlite_classes = ["RuntimeRoom"]

[[env.staging.migrations]]
tag = "v9"
deleted_classes = ["ByoBridgeRoom"]

[env.staging.ai]
binding = "AI"

# Durable Objects bind to the classes `clash-api-staging` exports itself (no
# `script_name`); their namespaces were created by the staging migrations above.
[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "ProjectRoom"

[[env.staging.durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "SupervisorAgent"

[[env.staging.durable_objects.bindings]]
name = "RENDER_CONTAINER"
class_name = "RenderContainer"

[[env.staging.durable_objects.bindings]]
name = "RUNTIME_ROOM"
class_name = "RuntimeRoom"

# Staging runs its own render Container; see the top-level [[containers]]
# comment for the image. One instance is enough for staging.
[[env.staging.containers]]
class_name = "RenderContainer"
image = "../render-server/Dockerfile.cf"
image_build_context = "../.."
max_instances = 1
# The render image is ~2.2 GB, over the default instance type's 2 GB image
# limit; standard-1 has a 4 GB disk.
instance_type = "standard-1"

# Staging's own Workflow, registered under a staging-only name.
[[env.staging.workflows]]
name = "generation-workflow-staging"
binding = "GENERATION_WORKFLOW"
class_name = "GenerationWorkflow"

# Staging-only data. Migrations are owned by apps/web (`apps/web/drizzle`).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "clash-staging"
database_id = "a04f1df0-7356-403c-8df0-0f7d5b5a1c6c"
migrations_dir = "../web/drizzle"

[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "clash-staging-assets"

# Issue #130: forward Document-body / capability uploads to the stateless
# upload Worker (wrangler.upload.toml). Remove this block to roll back; the
# same routes are still served in-process by this Worker.
[[env.staging.services]]
binding = "API_UPLOAD"
service = "clash-upload-staging"

# The top-level [triggers] cron is inherited by this environment.

# Required secrets (`wrangler secret put <NAME> --env staging`):
#   BETTER_AUTH_SECRET — same value as clash-web-staging; without it every
#                        session-authenticated /api request and browser /sync
#                        or /agents WebSocket is unauthenticated.
#   JWT_SECRET         — signs Resource delivery capabilities for cloud sync.
[env.staging.vars]
ENVIRONMENT = "staging"
BETTER_AUTH_BASE_PATH = "/api/better-auth"
# Wrangler refuses to inherit top-level vars into env sections, so we redeclare
# explicitly (empty = falls through to RENDER_CONTAINER DO at runtime).
RENDER_SERVER_URL = ""
MEDIA_GATEWAY_URL = ""
# Absolute origin for signed media URLs handed to remote plugins, providers
# and the render server. Staging traffic enters through the staging Web
# Worker, which proxies /assets to this Worker, so that origin is the public
# one. Production keeps setting WORKER_PUBLIC_URL as a secret (see above).
WORKER_PUBLIC_URL = "https://clash-web-staging.hrhrngxy.workers.dev"
# Hosted deployments retain gateway request/response bodies for 30 days and
# let platform_admin view them, audited (#353; apps/docs/guide/gateway-admin.md).
# The OSS top-level [vars] leaves this unset, so a self-host stores no bodies.
GATEWAY_STAFF_PROMPT_ACCESS = "enabled"

# Recover journaled generation whose Workflow scheduling or execution was interrupted.
[triggers]
crons = ["* * * * *"]
